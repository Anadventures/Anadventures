{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">
<div class="jumbotron">
    <div class="container-fluid text-center">
      <h1 class="display-3">Login</h1>
      <p>Access your account to post updates and manage your blog.</p>
    </div>
</div>

{% if error %}
<div class="container-fluid">
    <div class="alert alert-danger" style="max-width: 500px; margin: 0 auto;">
        <p class="error mb-0">{{error}}</p>
    </div>
</div>
{% endif %}

<main class="form-signin" style="max-width: 500px; margin: 50px auto; padding: 40px;">
    <form action="{{ url_for('login') }}" method="POST">
      <div class="text-center mb-4">
        <h1 class="h2 mb-3 font-weight-bold" style="color: #e60023;">Anadventures</h1>
        <p class="text-muted">by Ananya Solanki</p>
      </div>
  
      <div class="form-group">
        <label for="email-add"><strong>Username:</strong></label>
        <input type="text" class="form-control" id="email-add" name="email" placeholder="Enter your username" required style="height: 50px;">
      </div>

      <div class="form-group">
        <label for="password"><strong>Password:</strong></label>
        <input type="password" class="form-control" id="password" name="pwd" placeholder="Enter your password" required style="height: 50px;">
      </div>

      <button class="w-100 btn btn-lg btn-primary" type="submit" style="height: 50px; background-color: #e60023; border: none;">Sign In</button>
    </form>
</main>
</div>

{% endblock %}
